name: Reference Architecture Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  reference-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run reference architecture checks
        run: |
          chmod +x .ra/checks/ra-checks
          bash .ra/checks/ra-checks .

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-mock

      - name: Run project check
        run: |
          python3 -m pytest backend/tests/ && bash .ra/checks/ra-checks .

