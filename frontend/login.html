<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mi Turno</title>
    <link rel="icon" type="image/png" href="img/logo-muni.png">
    <!-- Importamos el CSS unificado -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">
        <img src="img/logo-muni.png" alt="Logo Municipalidad de Coronel Dorrego" class="login-logo">
        <h1>Mi Turno</h1>
        <p class="login-subtitle">Panel Administrativo</p>

        <form id="login-form">
            <div class="form-group">
                <label for="user">Nombre de usuario:</label>
                <input type="text" id="user" name="user" placeholder="Ej: admin_clinica" required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required
                    autocomplete="current-password">
            </div>

            <button type="submit" class="btn-primary" id="btnLogin">Ingresar</button>
        </form>
    </div>

    <!-- Footer -->
    <footer class="login-footer">
        <p>&copy;
            <script>document.write(new Date().getFullYear())</script> Mi Turno - Municipalidad de Coronel Dorrego. Todos
            los derechos reservados.
        </p>
    </footer>

    <!-- Scripts necesarios -->
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
